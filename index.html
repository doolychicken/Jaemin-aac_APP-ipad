<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="재민 AAC" />
  <meta name="application-name" content="재민 AAC" />
  <meta name="theme-color" content="#3b82f6" />
  <link rel="manifest" href="./manifest.webmanifest?v=395" />
  <link rel="apple-touch-icon" sizes="180x180" href="./images/app_icons/app-icon-180.png?v=347" />
  <link rel="preconnect" href="https://www.youtube.com" />
  <link rel="preconnect" href="https://img.youtube.com" />
  <link rel="preconnect" href="https://i.ytimg.com" />
  <title>AAC 앱</title>
  <link rel="stylesheet" href="./css/app.css?v=435" />
  <link rel="stylesheet" href="./css/features/study-puzzle.css?v=277" />
  <link rel="stylesheet" href="./css/features/recycling-game.css?v=339" />
  <link rel="stylesheet" href="./css/features/mart-cart-game.css?v=301" />
  <link rel="stylesheet" href="./css/features/traffic-light-game.css?v=307" />
  <link rel="stylesheet" href="./css/features/face-parts-game.css?v=329" />
  <link rel="stylesheet" href="./css/features/play-school.css?v=430" />
  <link rel="stylesheet" href="./css/features/play-household.css?v=430" />
  <link rel="stylesheet" href="./css/features/play-kiosk.css?v=430" />
  <link rel="stylesheet" href="./css/features/play-dishwash.css?v=430" />
  <link rel="stylesheet" href="./css/features/play-carwash.css?v=428" />
  <link rel="stylesheet" href="./css/features/play-snackshop.css?v=428" />
  <link rel="stylesheet" href="./css/features/sticker-book.css?v=428" />
  <link rel="stylesheet" href="./css/date-overrides.css?v=231" />
  <link rel="stylesheet" href="./css/features/morning-routine.css?v=434" />
  <link rel="stylesheet" href="./css/features/play-yesno.css?v=435" />
  <link rel="stylesheet" href="./css/features/play-elevator.css?v=437" />
  <link rel="stylesheet" href="./css/features/play-life-prep.css?v=441" />
</head>
<body>
  <main class="app">
    <div id="returnHint" class="return-hint">유튜브 시청 후 Safari 왼쪽 상단 뒤로 버튼으로 AAC로 돌아오세요.</div>
    <div class="topbar">
      <div>
        <h1 id="screenTitle" class="title">메인 화면</h1>
        <p id="breadcrumb" class="crumb" style="display:none;"></p>
      </div>
      <div class="topbar-btns">
        <button id="quickTalkButton" class="quick-talk-button" type="button" aria-haspopup="dialog" aria-controls="quickTalkDialog">바로 말하기</button>
        <button id="fullscreenButton" class="fullscreen-btn" type="button" aria-pressed="false">⛶ 전체화면</button>
        <button id="homeButton" class="home-btn" style="display:none;">🏠 홈</button>
        <button id="backButton" class="back-btn" style="display:none;">뒤로 가기</button>
      </div>
    </div>

    <section id="playerWrap" class="player-wrap" style="display:none;">
      <iframe
        id="youtubePlayer"
        class="player"
        title="AAC YouTube Player"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen>
      </iframe>
    </section>
    <button id="openInYoutubeButton" class="back-btn" style="display:none; align-self:flex-start;">유튜브에서 열기</button>

    <aside id="offlineStatus" role="status" hidden style="font-size:13px;color:#475569;display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span id="offlineStatusText"></span><button id="offlineRetry" type="button" hidden>다시 준비</button></aside>
    <p id="storageNotice" role="status" hidden style="color:#92400e; margin:4px 0;"></p>
    <p id="helperText" class="muted">버튼을 누르면 음성으로 읽어줍니다.</p>
    <button id="teachingAidResetButton" class="teaching-aid-reset" type="button" style="display:none;">↻ 처음부터 다시</button>
    <section id="heroRow" class="hero" style="display:none;"></section>
    <section id="spotlightView" class="spotlight" style="display:none;" aria-label="선택한 그림">
      <button type="button" id="spotlightButton" class="spotlight-button">
        <img id="spotlightImage" alt="" />
      </button>
    </section>
    <section id="buttonGrid" class="grid"></section>
    <dialog id="quickTalkDialog" class="quick-talk-dialog" aria-labelledby="quickTalkTitle">
      <div class="quick-talk-panel">
        <header class="quick-talk-header">
          <h2 id="quickTalkTitle">바로 말하기</h2>
          <form method="dialog">
            <button class="back-btn" type="submit" autofocus>돌아가기</button>
          </form>
        </header>
        <div id="quickTalkCards" class="quick-talk-grid"></div>
      </div>
    </dialog>
  </main>

  <script src="./js/data/study-data.js?v=428"></script>
  <script src="./js/data/sticker-book-data.js?v=428"></script>
  <script src="./js/data/home-sticker-data.js?v=429"></script>
  <script src="./js/data/storage-dress-data.js?v=428"></script>
  <script src="./js/data/app-data.js?v=440"></script>
  <script src="./js/data/life-prep-data.js?v=440"></script>
  <script src="./js/core/runtime.js?v=396"></script>
  <script src="./js/data/speech-manifest.js?v=440"></script>
  <script src="./js/core/offline-speech.js?v=397"></script>
  <script src="./js/core/pager.js?v=294"></script>
  <script src="./js/features/schedule.js?v=396"></script>
  <script src="./js/features/morning-routine.js?v=434"></script>
  <script src="./js/features/study-puzzle.js?v=396"></script>
  <script src="./js/features/recycling-game.js?v=396"></script>
  <script src="./js/features/mart-cart-game.js?v=396"></script>
  <script src="./js/features/traffic-light-game.js?v=396"></script>
  <script src="./js/features/face-parts-game.js?v=396"></script>
  <script src="./js/core/instrument-sounds.js?v=402"></script>
  <script src="./js/features/play-carwash.js?v=428"></script>
  <script src="./js/features/play-snackshop.js?v=428"></script>
  <script src="./js/features/play-kiosk.js?v=430"></script>
  <script src="./js/features/play-dishwash.js?v=430"></script>
  <script src="./js/features/play-tablesetting.js?v=430"></script>
  <script src="./js/features/play-objectnames.js?v=430"></script>
  <script src="./js/features/play-yesno.js?v=435"></script>
  <script src="./js/features/play-elevator.js?v=437"></script>
  <script src="./js/features/play-life-prep.js?v=441"></script>
  <script src="./js/features/play-school.js?v=438"></script>
  <script src="./js/features/sticker-book.js?v=428"></script>
  <script src="./js/main.js?v=435"></script>
  <script src="./js/core/offline-status.js?v=441"></script>
</body>
</html>
